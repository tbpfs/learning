name: Deploy Tutorial Site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run unit tests & build static site
        run: |
          python3 -m py_compile build_site.py book_models.py chapter_content.py affiliate_config.py i18n/*.py scripts/*.py examples/*.py tests/*.py
          python3 -W error -m unittest discover -s tests -v
          python3 build_site.py -o _site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Notify IndexNow (SEO/GEO)
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -A "PurpleMaple-IndexNow-Client/1.0 (+https://ai-purplemaple.com/)" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "learn.ai-purplemaple.com",
              "key": "7f4e9c2a8b1d6035e4a92c7f1b8d3e60",
              "keyLocation": "https://learn.ai-purplemaple.com/7f4e9c2a8b1d6035e4a92c7f1b8d3e60.txt",
              "urlList": [
                "https://learn.ai-purplemaple.com/",
                "https://learn.ai-purplemaple.com/ch01.html",
                "https://learn.ai-purplemaple.com/ch02.html",
                "https://learn.ai-purplemaple.com/ch03.html",
                "https://learn.ai-purplemaple.com/ch04.html",
                "https://learn.ai-purplemaple.com/ch05.html",
                "https://learn.ai-purplemaple.com/ch06.html",
                "https://learn.ai-purplemaple.com/ch07.html",
                "https://learn.ai-purplemaple.com/books/ai-engineering/",
                "https://learn.ai-purplemaple.com/books/ai-engineering/ch01.html",
                "https://learn.ai-purplemaple.com/zh-cn/",
                "https://learn.ai-purplemaple.com/zh-cn/ch01.html",
                "https://learn.ai-purplemaple.com/zh-cn/ch02.html",
                "https://learn.ai-purplemaple.com/zh-cn/ch03.html",
                "https://learn.ai-purplemaple.com/zh-cn/ch04.html",
                "https://learn.ai-purplemaple.com/zh-cn/ch05.html",
                "https://learn.ai-purplemaple.com/zh-cn/ch06.html",
                "https://learn.ai-purplemaple.com/zh-cn/ch07.html",
                "https://learn.ai-purplemaple.com/zh-cn/books/ai-engineering/",
                "https://learn.ai-purplemaple.com/zh-cn/books/ai-engineering/ch01.html",
                "https://learn.ai-purplemaple.com/en/",
                "https://learn.ai-purplemaple.com/en/ch01.html",
                "https://learn.ai-purplemaple.com/en/ch02.html",
                "https://learn.ai-purplemaple.com/en/ch03.html",
                "https://learn.ai-purplemaple.com/en/ch04.html",
                "https://learn.ai-purplemaple.com/en/ch05.html",
                "https://learn.ai-purplemaple.com/en/ch06.html",
                "https://learn.ai-purplemaple.com/en/ch07.html",
                "https://learn.ai-purplemaple.com/en/books/ai-engineering/",
                "https://learn.ai-purplemaple.com/en/books/ai-engineering/ch01.html",
                "https://learn.ai-purplemaple.com/llms.txt",
                "https://learn.ai-purplemaple.com/llms-full.txt"
              ]
            }' || echo "000")
          echo "IndexNow HTTP status: ${STATUS}"
          if [[ "${STATUS}" != "200" && "${STATUS}" != "202" ]]; then
            echo "::warning::IndexNow returned unexpected HTTP ${STATUS}"
          fi


