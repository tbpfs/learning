name: DevSecOps Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secops:
    uses: tbpfs/pm-secops-workflows/.github/workflows/reusable-secops.yml@main
    with:
      python_sast: true
      public_repo: true
      public_web_gate: true
      test_command: "python3 build_site.py && python3 -W error -m unittest discover -s tests -v"
