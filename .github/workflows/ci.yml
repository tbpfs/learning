name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile and run examples, unit tests & SEO/GEO site gate
        run: |
          python3 -m py_compile build_site.py examples/*.py tests/*.py
          for ex in examples/ch*.py; do python3 "${ex}"; done
          python3 -W error -m unittest discover -s tests -v
          python3 build_site.py -o /tmp/learn_ci_site
          if grep -rnE '(/home/antigravity|/workspace/|C:\\Users)' /tmp/learn_ci_site; then
            echo "::error::偵測到本機或容器內部路徑外洩至靜態網站產出！"
            exit 1
          fi

